# Runs on the OCI Ampere box. Caddy terminates TLS and proxies to the game
# server; the game server itself is never exposed directly on 443.
services:
  # Postgres replaced Supabase. Note there are no `ports:` — the database is
  # reachable only from the compose network, so the only thing that can talk to
  # it is the game server. Nothing on the public internet can reach 5432, which
  # is what makes it safe to run without the per-row policies Supabase needed.
  db:
    image: postgres:16-alpine
    restart: always
    # The box is a 1GB OCI micro instance, not the 24GB Ampere the README once
    # implied. Postgres' defaults assume far more, so it is tuned down here
    # rather than being left to discover the OOM killer at 2am — and capped
    # below, so if it ever does misbehave it cannot take the game server with
    # it. max_connections comfortably exceeds PG_POOL_MAX (10).
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c max_connections=20
      -c wal_compression=on
    mem_limit: 320m
    environment:
      POSTGRES_USER: "snake"
      POSTGRES_DB: "snake"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snake -d snake"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ..
    restart: always
    mem_limit: 256m
    # The server applies db/schema.sql on boot, so it must not start against a
    # database that is still initialising.
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      DATABASE_URL: "postgres://snake:${POSTGRES_PASSWORD}@db:5432/snake"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
      GOOGLE_WEB_CLIENT_ID: "${GOOGLE_WEB_CLIENT_ID:-}"
      FREE_ROOMS_PER_DAY: "${FREE_ROOMS_PER_DAY:-2}"
      CREDITS_TIMEZONE: "${CREDITS_TIMEZONE:-Asia/Kolkata}"
      REQUIRE_ACCOUNT_FOR_ROOMS: "${REQUIRE_ACCOUNT_FOR_ROOMS:-true}"
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: always
    mem_limit: 96m
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_DOMAIN: "${SERVER_DOMAIN}"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
